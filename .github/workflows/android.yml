name: Build DiPlay P170 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle environment
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find mobile/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK=$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Nissan-P170-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
